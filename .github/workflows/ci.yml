name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm type-check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  docker-smoke:
    name: docker-smoke
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate compose config
        run: docker compose -f docker-compose.yml config

      - name: Build compose services
        run: docker compose -f docker-compose.yml build

      - name: Start compose services
        run: docker compose -f docker-compose.yml up -d

      - name: Smoke check services
        shell: bash
        run: |
          set -euo pipefail

          check_url() {
            local url="$1"

            for attempt in {1..30}; do
              if curl --fail --silent --show-error "$url" >/dev/null; then
                echo "Smoke check passed: $url"
                return 0
              fi

              echo "Waiting for $url (${attempt}/30)"
              sleep 2
            done

            docker compose -f docker-compose.yml ps
            docker compose -f docker-compose.yml logs
            return 1
          }

          check_url http://localhost:3001/health/ready
          check_url http://localhost:3002/health/ready
          check_url http://localhost:3000

      - name: Tear down compose services
        if: always()
        run: docker compose -f docker-compose.yml down -v
